name: Validate Azure infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate development infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Sign in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep deployment
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -e

            az bicep install

            az deployment sub validate \
              --name "validate-webapp-dev" \
              --location "uksouth" \
              --parameters infra/environments/development.bicepparam
